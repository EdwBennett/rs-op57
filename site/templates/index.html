{% extends "base.html" %}

{% block title %}{{ section.title }} | {{ config.title }}{% endblock title %}

{% block main %}
      <h1>{{ section.title }}</h1>
      {{ section.content | safe }}
{% endblock main %}

{% block scripts %}
    <script type="module">
      import init, { randomConsecutivePrimes } from "{{ get_url(path='wasm/hello_core.js') }}";

      async function run() {
        await init();
        // Only fills the `prime` component placeholders written in
        // content/_index.md (see templates/components.html); all the
        // wording around them is the Markdown's.
        const primes = randomConsecutivePrimes();
        for (const el of document.querySelectorAll("[data-prime]")) {
          el.textContent = String(primes[Number(el.dataset.prime) - 1]);
        }
      }

      run();
    </script>
{% endblock scripts %}
