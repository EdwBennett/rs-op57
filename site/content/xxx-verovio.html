<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MXL Score Viewer (Verovio)</title>
  <script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js" defer></script>
</head>
<body>
  <button id="prev">◀</button> <span id="pageInfo"></span> <button id="next">▶</button>
  <div id="score"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      verovio.module.onRuntimeInitialized = async () => {
        const tk = new verovio.toolkit();
        tk.setOptions({
          scale: 40,
          pageWidth: 2100,
          adjustPageHeight: true,
          breaks: "auto"
        });

        const response = await fetch("./xxx-Piano.mxl");
        const buffer = await response.arrayBuffer();
        tk.loadZipDataBuffer(buffer);          // handles the compressed .mxl

        let page = 1;
        const total = tk.getPageCount();
        const show = () => {
          document.getElementById("score").innerHTML = tk.renderToSVG(page);
          document.getElementById("pageInfo").textContent = `${page} / ${total}`;
        };
        document.getElementById("prev").onclick = () => { if (page > 1) { page--; show(); } };
        document.getElementById("next").onclick = () => { if (page < total) { page++; show(); } };
        show();
      };
    });
  </script>
</body>
</html>
